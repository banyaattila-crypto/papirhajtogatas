  <style>
    /* Mobil csúszka (slider) érintésbarát kialakítása */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      height: 14px;
      border-radius: 999px;
      background: #1e293b;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #22d3ee;
      cursor: pointer;
      border: 3px solid #030712;
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.7);
    }
    input[type="range"]::-moz-range-thumb {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #22d3ee;
      cursor: pointer;
      border: 3px solid #030712;
      box-shadow: 0 0 15px rgba(34, 211, 238, 0.7);
    }
    /* Finom görgetősáv */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 999px;
    }

    /* Google Fraunces betűtípus és áramló színátmenet a főcímekhez */
    .font-fraunces {
      font-family: 'Fraunces', Georgia, serif;
      font-variation-settings: "SOFT" 50, "WONK" 1;
    }

    @keyframes gradientFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .title-balance { text-wrap: balance; }

    .no-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .bg-flow {
      background: linear-gradient(135deg, #0b3d91 0%, #3a2a9e 25%, #7a2398 50%, #a1306e 70%, #0b7a75 100%);
      background-size: 300% 300%;
      animation: gradientFlow 60s ease infinite;
    }

    .title-gradient-cosmic {
      background: linear-gradient(120deg, #ffffff 0%, #bae6fd 30%, #fde68a 65%, #ffffff 100%);
      background-size: 220% 220%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 7s ease infinite;
    }

    .title-gradient-gold {
      background: linear-gradient(120deg, #fef08a 0%, #f59e0b 40%, #34d399 80%, #fde047 100%);
      background-size: 220% 220%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 6s ease infinite;
    }

    .title-gradient-amber {
      background: linear-gradient(120deg, #ffffff 0%, #fbbf24 45%, #fb7185 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 8s ease infinite;
    }

    .title-gradient-rose {
      background: linear-gradient(120deg, #ffffff 0%, #fda4af 45%, #f0abfc 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 8s ease infinite;
    }

    .title-gradient-sky {
      background: linear-gradient(120deg, #ffffff 0%, #7dd3fc 45%, #a5b4fc 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientFlow 8s ease infinite;
    }

    /* Finom lebegő animáció az ikonoknak */
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-7px) rotate(3deg); }
    }
    .animate-float {
      animation: floatSlow 4.5s ease-in-out infinite;
    }

    /* Origami lap félbehajtás animáció (amikor nő a hajtásszám) */
    @keyframes origamiFoldPulse {
      0% { transform: perspective(600px) rotateY(0deg) scale(0.85); opacity: 0; }
      25% { opacity: 1; }
      60% { transform: perspective(600px) rotateY(-165deg) scale(1.05); opacity: 0.95; }
      100% { transform: perspective(600px) rotateY(-180deg) scale(0.9); opacity: 0; }
    }
    .animate-origami-fold {
      animation: origamiFoldPulse 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Arany búzaszem hullás animáció a sakktábla fölött */
    @keyframes wheatFall {
      0% { transform: translateY(-18px) rotate(0deg) scale(0.7); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(45px) rotate(140deg) scale(1.1); opacity: 0; }
    }
    .animate-wheat-drop {
      animation: wheatFall 0.95s ease-out forwards;
    }

    /* 3D lassan körbeforgó logó animáció */
    .logo-3d-scene {
      perspective: 700px;
    }
    @keyframes spin3dSlow {
      0% { transform: rotateY(0deg) rotateX(12deg); }
      50% { transform: rotateY(180deg) rotateX(-12deg); }
      100% { transform: rotateY(360deg) rotateX(12deg); }
    }
    .logo-3d-object {
      transform-style: preserve-3d;
      animation: spin3dSlow 11s linear infinite;
    }
    .logo-3d-object:hover {
      animation-duration: 3.5s;
    }
    .logo-face-front {
      transform: translateZ(10px);
    }
    .logo-face-back {
      transform: rotateY(180deg) translateZ(10px);
    }
    .logo-face-mid {
      transform: translateZ(0px);
    }
  </style>
</head>
