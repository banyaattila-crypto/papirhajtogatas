        subText = `${(mm * 1000).toLocaleString('hu-HU', { maximumFractionDigits: 0 })} mikrométer (µm)`;
      } else if (mm < 1000) {
        value = mm / 10;
        unit = 'cm';
        subText = `${mm.toLocaleString('hu-HU', { maximumFractionDigits: 2 })} mm`;
      } else if (mm < 1e6) {
        value = mm / 1000;
        unit = 'méter';
        subText = `${(mm / 10).toLocaleString('hu-HU', { maximumFractionDigits: 1 })} cm`;
      } else if (km < 1e6) {
        value = km;
        unit = 'km';
        subText = `${(mm / 1000).toLocaleString('hu-HU', { maximumFractionDigits: 0 })} méter`;
      } else if (km < AU_KM * 0.5) {
        value = km / 1e6;
        unit = 'millió km';
        subText = `${(km / 384400).toLocaleString('hu-HU', { maximumFractionDigits: 1 })}× Föld–Hold távolság`;
      } else if (km < LIGHT_YEAR_KM * 0.1) {
        value = km / 1e9;
        unit = 'milliárd km';
        const au = km / AU_KM;
        subText = `${au.toLocaleString('hu-HU', { maximumFractionDigits: 2 })} Csillagászati Egység (CSE)`;
      } else if (ly < 1e6) {
        value = ly;
        unit = 'fényév';
        subText = `${(ly / 100000).toLocaleString('hu-HU', { maximumFractionDigits: 3 })}× Tejútrendszer átmérő`;
      } else if (ly < 1e9) {
        value = ly / 1e6;
        unit = 'millió fényév';
        subText = `${(ly / 2.5e6).toLocaleString('hu-HU', { maximumFractionDigits: 2 })}× Androméda-galaxis távolság`;
      } else {
        value = ly / 1e9;
        unit = 'milliárd fényév';
        subText = `A megfigyelhető Univerzum (93 Mrd fényév) ${((ly / 9.3e10) * 100).toLocaleString('hu-HU', { maximumFractionDigits: 2 })}%-a`;
      }

      const formattedValue = new Intl.NumberFormat('hu-HU', {
        maximumFractionDigits: value < 10 ? 3 : 2,
        minimumFractionDigits: 0
      }).format(value);

      const meters = mm / 1000;
      const exp = Math.floor(Math.log10(meters));
      const mantissa = (meters / Math.pow(10, exp)).toFixed(2).replace('.', ',');

      return {
        formattedValue,
        unit,
        subText,
        rawMm: mm,
        meters,
        scientificMeters: `${mantissa} × 10^${exp} m`
      };
    };

    const formatLengthMm = (mm) => {
      if (mm <= 0) return '0 mm';
      const LIGHT_YEAR_MM = 9.46073e18;
      const km = mm / 1e6;

      if (mm < 10) return `${mm.toLocaleString('hu-HU', { maximumFractionDigits: 2 })} mm`;
      if (mm < 1000) return `${(mm / 10).toLocaleString('hu-HU', { maximumFractionDigits: 2 })} cm`;
      if (mm < 1e6) return `${(mm / 1000).toLocaleString('hu-HU', { maximumFractionDigits: 2 })} m`;
      if (km < 1e6) return `${km.toLocaleString('hu-HU', { maximumFractionDigits: 2 })} km`;
      if (mm < LIGHT_YEAR_MM) {
        const exp = Math.floor(Math.log10(km));
        const mant = (km / Math.pow(10, exp)).toFixed(2).replace('.', ',');
        return `${mant} × 10^${exp} km`;
      }
      const ly = mm / LIGHT_YEAR_MM;
      if (ly < 1e6) return `${ly.toLocaleString('hu-HU', { maximumFractionDigits: 2 })} fényév`;
      const expLy = Math.floor(Math.log10(ly));
      const mantLy = (ly / Math.pow(10, expLy)).toFixed(2).replace('.', ',');
      return `${mantLy} × 10^${expLy} fényév`;
    };

    const computeExactPowerOfTwoString = (n) => {
      if (n === 0) return '1';
      let digits = [1];
      for (let i = 0; i < n; i++) {
        let carry = 0;
        for (let j = 0; j < digits.length; j++) {
          const prod = digits[j] * 2 + carry;
          digits[j] = prod % 10;
          carry = Math.floor(prod / 10);
        }
        while (carry > 0) {
          digits.push(carry % 10);
          carry = Math.floor(carry / 10);
        }
      }
      const rawStr = digits.reverse().join('');
      return rawStr.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    };

    const formatLayers = (folds) => {
      const exactStr = computeExactPowerOfTwoString(folds);
      if (folds <= 35) {
        return { exact: exactStr, display: exactStr };
      }
      const exp = Math.floor(folds * Math.log10(2));
      const mantissa = (Math.pow(10, folds * Math.log10(2) - exp)).toFixed(2).replace('.', ',');
      return { exact: exactStr, display: `${mantissa} × 10^${exp}` };
    };

    // 2^n - 1 pontos szöveges kiszámítása a sakktábla összesített búzaszemeihez
    const computeExactPowerOfTwoMinusOneString = (n) => {
      if (n <= 0) return '0';
      let digits = [1];
      for (let i = 0; i < n; i++) {
        let carry = 0;
        for (let j = 0; j < digits.length; j++) {
          const prod = digits[j] * 2 + carry;
          digits[j] = prod % 10;
          carry = Math.floor(prod / 10);
        }
        while (carry > 0) {
          digits.push(carry % 10);
          carry = Math.floor(carry / 10);
        }
      }
      digits[0] -= 1;
      const rawStr = digits.reverse().join('');
      return rawStr.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    };

    // Búzaszemek súlyának formázása (1 szem = 40 mg)
    const formatWheatMass = (grainsCountFloat) => {
      const grams = grainsCountFloat * 0.04; // 40 mg = 0.04 g
      const kg = grams / 1000;
      const tons = kg / 1000;

      if (grams < 1) {
        return `${(grams * 1000).toLocaleString('hu-HU', { maximumFractionDigits: 0 })} mg`;
      }
      if (grams < 1000) {
        return `${grams.toLocaleString('hu-HU', { maximumFractionDigits: 2 })} gramm`;
      }
      if (kg < 1000) {
        return `${kg.toLocaleString('hu-HU', { maximumFractionDigits: 2 })} kg`;
      }
      if (tons < 1e6) {
        return `${tons.toLocaleString('hu-HU', { maximumFractionDigits: 2 })} tonna`;
      }
      if (tons < 1e9) {
        return `${(tons / 1e6).toLocaleString('hu-HU', { maximumFractionDigits: 2 })} millió tonna`;
      }
      return `${(tons / 1e9).toLocaleString('hu-HU', { maximumFractionDigits: 2 })} milliárd tonna`;
    };

    const App = () => {
      const [folds, setFolds] = useState(7);
      const [presetId, setPresetId] = useState('a4');
      const [t0, setT0] = useState(0.1);
      const [L0, setL0] = useState(297);
      const [autoPlay, setAutoPlay] = useState(false);
      const [chessSquare, setChessSquare] = useState(64);
      const [activeTab, setActiveTab] = useState('paper'); // 'paper' | 'chess'
      const [foldAnimKey, setFoldAnimKey] = useState(0);
      const [wheatDrops, setWheatDrops] = useState([]);
      const starCanvasRef = useRef(null);

      // Dinamikus 3D csillagmező háttér-animáció (a sebesség a hajtások számával nő!)
      useEffect(() => {
        const canvas = starCanvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        const resize = () => {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
        };
        resize();
        window.addEventListener('resize', resize);

        const stars = Array.from({ length: 85 }, () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 1.8 + 0.4,
          speed: Math.random() * 0.4 + 0.15,
          alpha: Math.random() * 0.6 + 0.2
        }));

        const render = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          // A hajtások számával gyorsuló kozmikus utazás érzet
          const speedBoost = 1 + Math.pow(folds / 35, 2.2);

          stars.forEach((s) => {
            s.y -= s.speed * speedBoost;
            if (s.y < 0) {
              s.y = canvas.height;
              s.x = Math.random() * canvas.width;
            }
            ctx.beginPath();
            ctx.fillStyle = `rgba(186, 230, 253, ${s.alpha})`;
            if (speedBoost > 3.5) {
              // Fénysebesség-csíkok magas hajtásszámnál
              ctx.rect(s.x, s.y, s.size * 0.8, Math.min(28, s.speed * speedBoost * 2.5));
            } else {
              ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
            }
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };
        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', resize);
        };
      }, [folds]);

      const handleSelectPreset = (preset) => {
        setPresetId(preset.id);
        setT0(preset.t0);
        setL0(preset.L0);
      };

      const triggerAnimatedFold = useCallback((targetFolds) => {
        const nextFolds = typeof targetFolds === 'number' ? targetFolds : Math.min(100, folds + 1);
        setFolds(nextFolds);
        setFoldAnimKey((k) => k + 1);
      }, [folds]);

      // Sakktábla mezőre kattintáskor arany búzaszem hullás indítása
      const handleChessClick = (sq) => {
        setChessSquare(sq);
        const batchId = Date.now();
        const count = Math.min(12, Math.max(3, Math.ceil(sq / 6)));
        const newDrops = Array.from({ length: count }, (_, i) => ({
          id: `${batchId}-${i}`,
          left: 15 + Math.random() * 70,
          delay: i * 0.04
        }));
        setWheatDrops(newDrops);
      };

      useEffect(() => {
        if (!autoPlay) return;
        const timer = setInterval(() => {
          setFolds((prev) => {
            if (prev >= 100) {
              setAutoPlay(false);
              return 100;
            }
            return prev + 1;
          });
        }, 850);
        return () => clearInterval(timer);
      }, [autoPlay]);

      const mathData = useMemo(() => {
        const rawMm = t0 * Math.pow(2, folds);
        const thickness = formatThickness(rawMm);
        const layers = formatLayers(folds);

        const twoPowN = Math.pow(2, folds);
        const gallivan1DMm = folds === 0 ? 0 : ((Math.PI * t0) / 6) * (twoPowN + 4) * (twoPowN - 1);
        const gallivan2DMm = folds === 0 ? 0 : Math.PI * t0 * Math.pow(2, 1.5 * (folds - 1));

        const isPossible1D = L0 >= gallivan1DMm;
        let maxPossibleFoldsForPaper = 0;
        for (let k = 1; k <= 30; k++) {
          const req = ((Math.PI * t0) / 6) * (Math.pow(2, k) + 4) * (Math.pow(2, k) - 1);
          if (L0 >= req) maxPossibleFoldsForPaper = k;
          else break;
        }

        const stiffnessExp = Math.floor(folds * Math.log10(8));
        const stiffnessMant = Math.pow(10, folds * Math.log10(8) - stiffnessExp).toFixed(2).replace('.', ',');

        return {
          thickness,
          layers,
          gallivan1DMm,
          gallivan1DFormatted: formatLengthMm(gallivan1DMm),
          gallivan2DFormatted: formatLengthMm(gallivan2DMm),
          isPossible1D,
          maxPossibleFoldsForPaper,
          stiffnessStr: folds <= 6 ? Math.pow(8, folds).toLocaleString('hu-HU') : `${stiffnessMant} × 10^${stiffnessExp}`
        };
      }, [folds, t0, L0]);

      const currentMilestone = useMemo(() => {
        return [...MILESTONES].reverse().find((m) => folds >= m.n) || MILESTONES[0];
      }, [folds]);

      const nextMilestone = useMemo(() => {
        return MILESTONES.find((m) => folds < m.n) || null;
      }, [folds]);

      // Sakktábla (1..64 mező) számítások
      const chessData = useMemo(() => {
        const k = chessSquare;
        const grainsOnSquareExact = computeExactPowerOfTwoString(k - 1);
        const cumulativeGrainsExact = computeExactPowerOfTwoMinusOneString(k);
        const grainsOnSquareFloat = Math.pow(2, k - 1);
        const cumulativeGrainsFloat = Math.pow(2, k) - 1;

        const cumulativeTons = (cumulativeGrainsFloat * 0.04) / 1e6;
        const GLOBAL_ANNUAL_WHEAT_TONS = 700e6; // 700 millió tonna / év
      const yearsOfGlobalHarvest = cumulativeTons / GLOBAL_ANNUAL_WHEAT_TONS;

      // Búzakúp fizikai geometria (1 szem térfogata ~ 0.05 cm³ = 5e-8 m³, rézsűszög ~ 28°)
      const pileVolumeM3 = grainsOnSquareFloat * 5e-8;
      // Kúp térfogat V = (1/3) * pi * r^2 * h, ahol h = r * tan(28°) ≈ 0.5317 * r => r = (3*V / (pi*0.5317))^(1/3)
      const coneRadiusM = Math.pow((3 * pileVolumeM3) / (Math.PI * 0.5317), 1 / 3);
      const coneHeightM = coneRadiusM * 0.5317;

      const formatConeDim = (m) => {
        if (m < 0.01) return `${(m * 1000).toLocaleString('hu-HU', { maximumFractionDigits: 1 })} mm`;
        if (m < 1) return `${(m * 100).toLocaleString('hu-HU', { maximumFractionDigits: 1 })} cm`;
        if (m < 1000) return `${m.toLocaleString('hu-HU', { maximumFractionDigits: 2 })} m`;
        return `${(m / 1000).toLocaleString('hu-HU', { maximumFractionDigits: 2 })} km`;
      };

      let visualStageDesc = '';
      if (k <= 4) {
        visualStageDesc = 'Néhány különálló szem a mező közepén (1, 2, 4, 8 szem) – könnyedén megszámolható.';
      } else if (k <= 8) {
        visualStageDesc = 'Szabályos sorokba rendezett búzaszemek (16–128 szem), amelyek kezdik teljesen betakarni a mezőt.';
      } else if (k <= 12) {
        visualStageDesc = 'Meredek búzakúpok és piramisok emelkednek a táblán (256–2048 szem), túlnőve a sakkfigurák magasságán!';
      } else if (k <= 20) {
        visualStageDesc = 'A búzakúp lezúdul a sakktábláról és betemeti a szobát (több mázsa / tonna búza).';
      } else if (k <= 40) {
        visualStageDesc = 'Hatalmas arany búzahegy, amely felhőkarcolókat és hegycsúcsokat temet maga alá.';
      } else {
        visualStageDesc = 'Bolygóléptékű búzaóceán: a kúp csúcsa már a világűrbe (több száz kilométer magasra) nyúlik!';
      }

      return {
        k,
        grainsOnSquareExact,
        cumulativeGrainsExact,
        squareMassStr: formatWheatMass(grainsOnSquareFloat),
        cumulativeMassStr: formatWheatMass(cumulativeGrainsFloat),
        yearsOfGlobalHarvest,
        coneHeightStr: formatConeDim(coneHeightM),
        coneDiameterStr: formatConeDim(coneRadiusM * 2),
        visualStageDesc,
        harvestStr:
          yearsOfGlobalHarvest < 0.0001
            ? 'Elhanyagolható töredék (< 0,01 mp a világtermésből)'
            : yearsOfGlobalHarvest < 1
            ? `A Föld éves termésének ${(yearsOfGlobalHarvest * 100).toLocaleString('hu-HU', { maximumFractionDigits: 2 })}%-a`
            : `${yearsOfGlobalHarvest.toLocaleString('hu-HU', { maximumFractionDigits: 1 })} évnyi teljes földi búzatermés!`
      };
    }, [chessSquare]);

    return (
      <div className="min-h-screen bg-gradient-to-br from-[#071124] via-[#0d1936] to-[#130d2e] text-slate-100 pb-14 relative">
          {/* Interaktív csillagmező háttér */}
          <canvas ref={starCanvasRef} className="fixed inset-0 pointer-events-none z-0 opacity-75" />

          <div
            className="fixed inset-0 pointer-events-none z-0"
            style={{
              backgroundImage:
                'radial-gradient(circle at 18% 20%, rgba(16, 185, 129, 0.14) 0%, transparent 45%), radial-gradient(circle at 82% 35%, rgba(56, 189, 248, 0.16) 0%, transparent 50%), radial-gradient(circle at 50% 85%, rgba(168, 85, 247, 0.16) 0%, transparent 55%)'
            }}
          />

          {/* Lebegő Origami Hajtás Visszajelző (minden új hajtásnál villan egyet) */}
          {foldAnimKey > 0 && (
            <div
              key={foldAnimKey}
              className="fixed bottom-6 right-6 z-50 pointer-events-none animate-origami-fold flex items-center gap-2 px-4 py-2.5 rounded-2xl bg-slate-900/90 border border-cyan-400/60 shadow-[0_0_25px_rgba(34,211,238,0.45)]"
            >
              <div className="w-6 h-6 rounded bg-gradient-to-tr from-cyan-400 to-purple-500 shadow-inner" />
              <span className="font-mono text-xs font-bold text-cyan-300">
                2^{folds} réteg!
              </span>
            </div>
          )}

          {/* FEJLÉC */}
          <header className="relative z-10 pt-6 pb-5 px-4 sm:px-6 max-w-7xl mx-auto border-b border-slate-800/80">
            <div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
              <div className="flex items-start sm:items-center gap-4">
                {/* 3D Lassan Körbeforgó Origami Logó a bal felső sarokban */}
                <div
                  onClick={() => triggerAnimatedFold(Math.min(100, folds + 1))}
                  title="Kattints a logóra a következő hajtáshoz!"
                  className="logo-3d-scene shrink-0 cursor-pointer select-none pt-1 sm:pt-0"
                >
                  <div className="logo-3d-object relative w-14 h-14 sm:w-16 sm:h-16">
                    {/* Középső ragyogó mag */}
                    <div className="logo-face-mid absolute inset-1 rounded-2xl bg-cyan-400/20 blur-md" />
                    {/* Előlap */}
                    <div className="logo-face-front absolute inset-0 rounded-2xl bg-gradient-to-br from-cyan-400 via-blue-600 to-purple-700 p-[2px] shadow-[0_0_25px_rgba(34,211,238,0.45)]">
                      <div className="w-full h-full rounded-[14px] bg-slate-950/90 flex flex-col items-center justify-center relative overflow-hidden">
                        {/* Hajtott sarok effekt */}
                        <div className="absolute top-0 right-0 w-4 h-4 bg-gradient-to-bl from-cyan-300 to-blue-500 rounded-bl-lg opacity-90" />
                        <svg viewBox="0 0 36 36" className="w-7 h-7 sm:w-8 sm:h-8 text-cyan-300">
                          <polygon points="6,24 18,16 30,24 18,31" fill="rgba(34,211,238,0.2)" stroke="currentColor" strokeWidth="1.8" />
                          <polygon points="6,18 18,10 30,18 18,25" fill="rgba(168,85,247,0.25)" stroke="#c084fc" strokeWidth="1.8" />
                          <polygon points="6,12 18,4 30,12 18,19" fill="rgba(56,189,248,0.35)" stroke="#ffffff" strokeWidth="1.8" />
                        </svg>
                        <span className="text-[9px] font-mono font-black tracking-tighter text-cyan-300 -mt-0.5">
                          2ⁿ LAB
                        </span>
                      </div>
                    </div>
                    {/* Hátlap */}
                    <div className="logo-face-back absolute inset-0 rounded-2xl bg-gradient-to-tr from-amber-400 via-purple-600 to-cyan-500 p-[2px] shadow-[0_0_25px_rgba(192,132,252,0.45)]">
                      <div className="w-full h-full rounded-[14px] bg-slate-950/95 flex flex-col items-center justify-center">
                        <span className="font-fraunces text-base sm:text-lg font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-cyan-300">
                      2<sup className="text-xs text-amber-300">100</sup>
                    </span>
                    <span className="text-[8px] font-mono uppercase tracking-widest text-purple-300">
                      v1.5.1
                    </span>
                  </div>
                </div>
              </div>
            </div>

            <div className="flex-1 min-w-0">
              <div className="flex flex-wrap items-center gap-2 mb-2">
                <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-500/15 border border-cyan-400/35 text-cyan-200 text-xs font-mono uppercase tracking-wider">
                  <Sparkles className="w-3.5 h-3.5" />
                  Mobilra Optimalizált Tudományos Szimulátor (0–100)
                </div>
              </div>
              <h1 className="font-fraunces text-2xl sm:text-5xl font-black tracking-tight leading-tight title-gradient-cosmic">
                Exponenciális Növekedés Labor
              </h1>

              {/* FÜLEK / TABOK KÖZVETLENÜL A FŐCÍM ALATT */}
              <nav
                role="tablist"
                aria-label="Feladatok közötti váltás"
                className="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-2 bg-slate-950/85 p-1.5 rounded-2xl border border-slate-800/90 shadow-inner"
              >
                <button
                  role="tab"
                  aria-selected={activeTab === 'paper'}
                  onClick={() => setActiveTab('paper')}
                  className={`px-3.5 py-2.5 rounded-xl text-left sm:text-center font-bold text-xs sm:text-sm transition-all flex items-center justify-start sm:justify-center gap-2 ${
                    activeTab === 'paper'
                      ? 'bg-gradient-to-r from-cyan-500/25 via-blue-500/25 to-purple-500/25 text-white border border-cyan-400/60 shadow-[0_0_20px_rgba(34,211,238,0.2)]'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/60 border border-transparent'
                  }`}
                >
                  <span className="text-base shrink-0">📄</span>
                  <span className="font-fraunces truncate">1. Hányszor lehet félbehajtani egy papírt?</span>
                </button>

                <button
                  role="tab"
                  aria-selected={activeTab === 'chess'}
                  onClick={() => setActiveTab('chess')}
                  className={`px-3.5 py-2.5 rounded-xl text-left sm:text-center font-bold text-xs sm:text-sm transition-all flex items-center justify-start sm:justify-center gap-2 ${
                    activeTab === 'chess'
                      ? 'bg-gradient-to-r from-yellow-500/25 via-amber-500/25 to-emerald-500/25 text-white border border-yellow-400/60 shadow-[0_0_20px_rgba(250,204,21,0.2)]'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/60 border border-transparent'
                  }`}
                >
                  <span className="text-base shrink-0">♟️</span>
                  <span className="font-fraunces truncate">2. A sakktábla és a búzaszemek története</span>
                </button>
              </nav>
            </div>
          </div>

          {activeTab === 'paper' && (
            <div className="bg-slate-950/75 backdrop-blur-md border border-slate-700/80 rounded-2xl p-3.5 w-full lg:w-auto lg:min-w-[330px] shadow-lg">
              <label className="flex items-center gap-2 text-xs font-mono uppercase tracking-wider text-cyan-400 mb-2">
                <Sliders className="w-3.5 h-3.5" />
                Kísérleti Papír Kiválasztása (t₀, L₀)
              </label>
              <select
                value={presetId}
                onChange={(e) => {
                  const found = PAPER_PRESETS.find((p) => p.id === e.target.value);
                  if (found) handleSelectPreset(found);
                }}
                className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white font-medium focus:outline-none focus:border-cyan-400"
              >
                {PAPER_PRESETS.map((p) => (
                  <option key={p.id} value={p.id}>
                    {p.name}
                  </option>

                <div className="lg:col-span-7 space-y-4">
                  <div className="p-4 sm:p-5 rounded-2xl bg-slate-950/85 border border-yellow-500/30 space-y-3 text-slate-200 text-sm sm:text-base leading-relaxed">
                    <p>
                      A sakk nagyjából kétezer évvel ezelőtt Indiából indult el hódító útjára. Egy népszerű legenda szerint{' '}
                      <strong className="text-yellow-300">Shehram hindu király</strong> bölcs tanácsadója,{' '}
                      <strong className="text-yellow-300">Sessa ebn Daher</strong> találta ki ura unalmának elűzésére. A tudós mindössze annyit kért jutalmul az uralkodótól, hogy a sakktábla első négyzetére tegyenek <strong>egy szem búzát</strong>, a másodikra annak kétszeresét, azaz <strong>kettő szemet</strong>, a harmadikra szintén az előző kétszeresét, s így tovább.
                    </p>
                    <p>
                      A király örömmel teljesítette volna a szerény kérést, ám kiderült, hogy a világon nincs annyi búzaszem összesen, amennyi a hatvannégy kockára jutott volna: több mint <strong className="text-amber-300">18 trillió</strong> – egészen pontosan{' '}
                      <span className="font-mono font-bold text-yellow-300 bg-yellow-500/10 px-1.5 py-0.5 rounded border border-yellow-500/30">
                        18 446 744 073 709 551 615
                      </span>{' '}
                      – búzaszemet kellett volna elhelyezni a táblán…
                    </p>
                  </div>

                  <div className="p-4 sm:p-5 rounded-2xl bg-emerald-950/40 border border-emerald-500/40 space-y-2">
                    <div className="flex items-center gap-2 text-emerald-300 font-black text-base sm:text-lg">
                      <span>🌾</span>
                      <span>Száz év alatt terem ennyi búza</span>
                    </div>
                    <p className="text-slate-200 text-sm sm:text-base leading-relaxed">
                      Ha egy búzaszem átlagos súlya <strong className="text-emerald-300">40 milligramm</strong>, akkor a bölcs férfiú által kért mennyiség több mint{' '}
                      <strong className="text-emerald-300">700 milliárd tonna</strong> (egészen pontosan ~737,87 milliárd tonna) búza lenne. Ha figyelembe vesszük, hogy manapság a Földön összesen mintegy{' '}
                      <strong className="text-white">700 millió tonna búza</strong> terem évente, akkor a jelenlegi termelési technológia mellett{' '}
                      <strong className="text-yellow-300 underline decoration-yellow-500/60">száz év (sőt, több mint ezer év!)</strong> szükségeltetne ennyi búzaszem előállításához…
                    </p>
                  </div>

                  {/* Matematikai összefüggés doboz */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div className="p-3.5 rounded-2xl bg-slate-950/90 border border-slate-800">
                      <div className="text-[11px] font-mono text-yellow-400 uppercase">Mező képlete (k. kocka)</div>
                      <div className="text-base font-mono font-black text-white mt-1">
                        B(k) = 2<sup className="text-yellow-400">k-1</sup> szem
                      </div>
                      <div className="text-[11px] text-slate-400 mt-0.5">Ugyanaz, mint k-1 papírhajtás!</div>
                    </div>
                    <div className="p-3.5 rounded-2xl bg-slate-950/90 border border-slate-800">
                      <div className="text-[11px] font-mono text-amber-400 uppercase">Összesen 64 mezőn</div>
                      <div className="text-base font-mono font-black text-white mt-1">
                        S₆₄ = 2<sup className="text-amber-400">64</sup> - 1
                      </div>
                      <div className="text-[11px] text-slate-400 mt-0.5">18,44 trillió szem búza</div>
                    </div>
                    <div className="p-3.5 rounded-2xl bg-slate-950/90 border border-slate-800">
                      <div className="text-[11px] font-mono text-emerald-400 uppercase">Papír 64 hajtásnál</div>
                      <div className="text-base font-mono font-black text-emerald-300 mt-1">
                        1,84 billió km
                      </div>
                      <div className="text-[11px] text-slate-400 mt-0.5">~0,195 fényév vastag!</div>
                    </div>
                  </div>
                </div>

                {/* Interaktív 8x8-as Sakktábla Szimulátor */}
                <div className="lg:col-span-5 bg-slate-950/90 border border-yellow-500/30 rounded-2xl p-4 sm:p-5 flex flex-col justify-between space-y-4 relative overflow-hidden">
                  {/* Arany búzaszem hullás részecskék */}
                  {wheatDrops.map((drop) => (
                    <span
                      key={drop.id}
                      style={{ left: `${drop.left}%`, animationDelay: `${drop.delay}s` }}
                      className="absolute top-6 text-base pointer-events-none select-none z-20 animate-wheat-drop"
                    >
                      🌾
                    </span>
                  ))}
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-xs font-mono uppercase tracking-wider text-yellow-400 font-bold">
                        Interaktív Sakktábla (1–64. mező)
                      </span>
                      <span className="text-xs font-mono text-slate-400">Bökj egy mezőre!</span>
                    </div>

                    {/* 8x8 Sakktábla Rács */}
                    <div className="grid grid-cols-8 gap-1 p-2 rounded-xl bg-slate-900 border border-slate-800 aspect-square max-w-[330px] mx-auto">
                      {Array.from({ length: 64 }, (_, idx) => {
                        const sq = idx + 1;
                        const row = Math.floor(idx / 8);
                        const col = idx % 8;
                        const isDark = (row + col) % 2 === 1;
                        const isSelected = chessSquare === sq;
                        return (
                          <button
                            key={sq}
                            onClick={() => handleChessClick(sq)}
                            className={`rounded-md flex flex-col items-center justify-center text-[10px] sm:text-xs font-mono transition-all ${
                              isSelected
                                ? 'bg-yellow-400 text-slate-950 font-black ring-2 ring-white scale-105 z-10 shadow-lg'
                                : isDark
                                ? 'bg-slate-800/90 text-slate-300 hover:bg-slate-700'
                                : 'bg-slate-950/90 text-slate-400 hover:bg-slate-800'
                            }`}
                          >
                            <span>{sq}</span>
                            {sq === 1 && <span className="text-[8px]">🌾1</span>}
                            {sq === 64 && <span className="text-[8px]">👑</span>}
                          </button>
                        );
                      })}
                    </div>

                    {/* Gyorsválasztó mező gombok */}
                    <div className="flex flex-wrap items-center justify-center gap-1.5 mt-3">
                      {[1, 2, 8, 16, 24, 32, 48, 64].map((sq) => (
                        <button
                          key={sq}
                          onClick={() => handleChessClick(sq)}
                          className={`px-2 py-1 rounded-lg text-[11px] font-mono ${
                            chessSquare === sq
                              ? 'bg-yellow-400 text-slate-950 font-bold'
                              : 'bg-slate-900 text-slate-300 border border-slate-800'
                          }`}
                        >
                          {sq}. mező
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Kiválasztott mező élő adatai */}
                  <div className="p-3.5 rounded-xl bg-slate-900/90 border border-yellow-500/30 space-y-2">
                    <div className="flex items-center justify-between border-b border-slate-800 pb-1.5">
                      <span className="text-xs font-mono text-yellow-300 font-bold">
                        Kiválasztva: {chessData.k}. mező (2^{chessData.k - 1})
                      </span>
                      <span className="text-[11px] font-mono text-slate-400">
                        1–{chessData.k}. mező összesen:
                      </span>
                    </div>

                    <div>
                      <div className="text-[11px] text-slate-400 font-mono">Búzaszemek száma ezen az 1 mezőn:</div>
                      <div className="text-xs sm:text-sm font-mono font-bold text-white break-all">
                        {chessData.grainsOnSquareExact} szem ({chessData.squareMassStr})
                      </div>
                    </div>

                    <div>
                      <div className="text-[11px] text-yellow-300/90 font-mono">
                        Összes búzaszem az 1–{chessData.k}. mezőkön (2^{chessData.k} - 1):
                      </div>
                      <div className="text-xs sm:text-sm font-mono font-black text-yellow-300 break-all">
                        {chessData.cumulativeGrainsExact} szem
                      </div>
                    </div>

                    <div className="pt-1.5 border-t border-slate-800 flex items-center justify-between text-xs">
                      <span className="text-slate-400">Össztömeg (40 mg/szem):</span>
                      <span className="font-mono font-bold text-emerald-300">{chessData.cumulativeMassStr}</span>
                    </div>
                    <div className="flex items-center justify-between text-[11px]">
                      <span className="text-slate-400">Viszonyítva (700M t/év):</span>
                      <span className="font-mono font-semibold text-amber-300 text-right">{chessData.harvestStr}</span>
                    </div>
                  </div>
                </div>
              </div>
            </section>
            )}
          </main>

          {/* LÁBLÉC: Semantic Versioning (SemVer 2.0.0) Verziószám */}
      <footer className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 pt-6 pb-4 border-t border-slate-800/80 text-xs text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-3">
        <div className="flex items-center gap-2 font-mono">
          <span className="px-2 py-0.5 rounded bg-cyan-500/10 border border-cyan-500/30 text-cyan-300 font-bold">
            v1.5.1
          </span>
          <span>• SemVer 2.0.0 (MAJOR.MINOR.PATCH)</span>
        </div>
        <div className="text-center sm:text-right text-[11px] text-slate-500 font-mono">
          1 (Stabil kiadás) . 5 (Füles/Tabos nézet, 0–100 hajtás, Sakktábla, 3D Logó) . 1 (Fülek főcím alá igazítva)
        </div>
      </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
